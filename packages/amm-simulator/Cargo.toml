[package]
name = "soroban-amm-simulator"
version = "0.1.0"
edition = "2021"
description = "Off-chain simulation engine and CLI for Soroban AMM strategies"
license = "MIT"
repository = "https://github.com/promisszn/soroban-amm"
keywords = ["soroban", "stellar", "amm", "simulation", "backtesting"]
categories = ["finance"]
readme = "README.md"

[lib]
name = "soroban_amm_simulator"

[[bin]]
name = "amm-sim"
path = "src/bin/amm-sim.rs"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
csv = "1.3"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# `tests/parity.rs` runs the *real* `amm` contract inside a Soroban test `Env`
# next to the simulator and asserts the two agree exactly, so the contract
# crates are dev-dependencies here. They are dev-only: nothing in `src/` links
# against a contract, which keeps this crate a plain host-side `std` tool.
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
amm = { path = "../../contracts/amm", features = ["testutils"] }
proptest = "1"
