name: Testnet Smoke Test

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network to test against
        default: testnet
        required: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Channel and target come from rust-toolchain.toml.
      - name: Setup Rust
        run: rustup show

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Version comes from .stellar-version (single source of truth, also read
      # by the Dockerfile and the release workflow). The stellar/stellar-cli
      # action is not used here because GitHub Actions does not allow an
      # expression in `uses:`, so its tag could not follow the pinned file.
      - name: Read Stellar CLI version
        id: stellar_cli
        run: echo "version=$(cat .stellar-version)" >> "$GITHUB_OUTPUT"
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version "${{ steps.stellar_cli.outputs.version }}"

      - name: Import smoke test identity
        shell: bash
        env:
          STELLAR_SECRET_KEY: ${{ secrets.TESTNET_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_SECRET_KEY" ]; then
            echo "TESTNET_SECRET_KEY is not configured"
            exit 1
          fi
          printf '%s\n' "$STELLAR_SECRET_KEY" | stellar keys add ci-smoke --secret-key

      - name: Run e2e script
        shell: bash
        run: bash scripts/e2e.sh
        env:
          STELLAR_NETWORK: ${{ inputs.network }}
          STELLAR_SECRET_KEY: ${{ secrets.TESTNET_SECRET_KEY }}
          SOURCE_ACCOUNT: ci-smoke

